name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # Generate platform scaffolding (web/, etc.) not committed to the repo.
      - name: Generate platform files
        run: flutter create . --platforms=web --project-name algo_trading_app

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
